# Build and push the all-in-one image to Docker Hub.
# Secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN
# Optional: run workflow_dispatch from GitHub Actions UI.
#
# Update community-apps/templates/borrowarr.xml <Repository> to match DOCKERHUB_USERNAME/borrowarr

name: Docker Hub (all-in-one)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.all-in-one
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/borrowarr:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/borrowarr:${{ github.ref_name }}
          build-args: |
            NEXT_PUBLIC_API_URL=