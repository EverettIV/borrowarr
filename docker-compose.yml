# Default: bridge network with published ports 3012/3013.
# If compose fails with "address pools have been fully subnetted", either:
#   docker network prune -f
# or use host networking (Linux):
#   docker compose -f docker-compose.host-network.yml up -d --build

name: borrowarr

services:
  borrowarr-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: borrowarr-server
    restart: unless-stopped
    ports:
      - "3013:3013"
    # Optional — if missing, the server generates JWT secrets on the data volume at first boot
    env_file:
      - path: ./server/.env
        required: false
    environment:
      NODE_ENV: production
      PORT: "3013"
      SQLITE_STORAGE_PATH: /app/data/database.sqlite
      # Container paths — mount host dirs at the same paths (see server/.env.example)
      BORROWARR_MEDIA: ${BORROWARR_MEDIA:-/media}
      BORROWARR_DOWNLOADS: ${BORROWARR_DOWNLOADS:-/downloads}
      BORROWARR_ENSURE_MEDIA_DIRS: ${BORROWARR_ENSURE_MEDIA_DIRS:-true}
    volumes:
      - borrowarr-server-data:/app/data
      - ${BORROWARR_HOST_MEDIA:-./media}:/media
      - ${BORROWARR_HOST_DOWNLOADS:-./downloads}:/downloads

  borrowarr-client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        # Browser calls the API on the host-mapped port (not the Docker service name).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3013}
    container_name: borrowarr-client
    restart: unless-stopped
    ports:
      - "3012:3012"
    environment:
      NODE_ENV: production
      PORT: "3012"
    depends_on:
      - borrowarr-server

volumes:
  borrowarr-server-data: