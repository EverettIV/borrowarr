# Single container: UI (3012) + API (3013) in one service.
# Default dual-stack compose remains docker-compose.yml.
#
#   docker compose -f docker-compose.all-in-one.yml up -d --build
#
# Host networking (Linux address-pool issues):
#   docker compose -f docker-compose.all-in-one.host-network.yml up -d --build

name: borrowarr

services:
  borrowarr:
    build:
      context: .
      dockerfile: Dockerfile.all-in-one
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3013}
    container_name: borrowarr
    restart: unless-stopped
    ports:
      - "3012:3012"
      - "3013:3013"
    env_file:
      - path: ./server/.env
        required: false
    environment:
      NODE_ENV: production
      API_PORT: "3013"
      CLIENT_PORT: "3012"
      PORT: "3013"
      SQLITE_STORAGE_PATH: /app/data/database.sqlite
      BORROWARR_MEDIA: ${BORROWARR_MEDIA:-/media}
      BORROWARR_DOWNLOADS: ${BORROWARR_DOWNLOADS:-/downloads}
      BORROWARR_ENSURE_MEDIA_DIRS: ${BORROWARR_ENSURE_MEDIA_DIRS:-true}
    volumes:
      - borrowarr-server-data:/app/data
      - ${BORROWARR_HOST_MEDIA:-./media}:/media
      - ${BORROWARR_HOST_DOWNLOADS:-./downloads}:/downloads

volumes:
  borrowarr-server-data: